# Preserve every built-in detector. Exceptions require rule AND exact path AND content.
# No directory/commit exclusions, rule disabling, blanket test exemption or baseline.
# Hex escapes spell exact synthetic literals without adding credential-looking strings.
title = "Codestead reviewed fixture exceptions"

[extend]
useDefault = true

# Historical temporary registration fixture: two named migration SHA-256 entries, not Sumo credentials.
[[allowlists]]
description = "Historical temporary registration fixture: two named migration SHA-256 entries, not Sumo credentials."
targetRules = ["sumologic-access-token"]
condition = "AND"
paths = ['''^\.tmp-backup-status-registration\.mjs$''']
regexTarget = "line"
regexes = [
  '''^\s*\["0008_abandoned_sumo\.sql", "[a-f0-9]{64}"\],$''',
  '''^\s*\["0015_classy_sumo\.sql", "[a-f0-9]{64}"\],$''',
]

